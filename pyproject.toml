[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pixverse-platform-cli"
version = "0.8.0"
description = "PixVerse Platform OpenAPI command-line client"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["click>=8.1,<9", "httpx>=0.27,<1", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1,<2"]

[project.scripts]
pixverse-api = "cli.cli:main"

[tool.setuptools.packages.find]
include = ["cli", "cli.skills"]
namespaces = true

[tool.setuptools.package-data]
"cli" = ["skills/*.md", "schemas.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project.urls]
Repository = "https://github.com/PixVerseAI/enterprise"
